name: pipeline

# Trunk-based: every push to main is checked and, if green, deployed to the
# only environment, production. A manual run from another branch only checks.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time across all refs, never cancelled: every run targets the
# same production service, cancelling a run also kills its deploy job, and an
# interrupted `services replace` leaves the service in an unknown state.
# Pushes made meanwhile collapse into a single queued run of the latest.
concurrency:
  group: pipeline-production
  cancel-in-progress: false

# Least privilege: only the deploy job gets id-token.
permissions:
  contents: read

jobs:
  # All five checks run in parallel: the pipeline is as slow as the slowest
  # check, not their sum.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Pyright
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Pytest
        run: uv run pytest --cov=test_api --cov-report=term-missing

  # SAST: finds insecure code patterns and hardcoded credentials.
  # Only ERROR-severity findings fail the job; the rest are informational.
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - name: Semgrep
        run: semgrep scan --config auto --severity ERROR --error

  # SCA: vulnerable dependencies in uv.lock. Blocks on HIGH/CRITICAL only, so
  # the scanner stays quiet enough that nobody is tempted to disable it.
  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # Build and deploy in one job: one runner, one auth, no image hand-off.
  # The image is tagged with the commit SHA, so what was checked is what runs.
  deploy:
    needs: [lint, typecheck, test, sast, sca]
    # Only main reaches production; the Environment's branch policy enforces
    # the same rule on GitHub's side (infra/gcp/setup-github.sh).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Environment name lands in the OIDC token, and the deployer SA only
    # trusts its own environment (infra/gcp/setup-wif.sh).
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-east1-docker.pkg.dev/lorenz-1234/test-api/test-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      # GitOps: the service is whatever the manifest says. Only the image
      # line is filled in, so a manual console change is overwritten here.
      - name: Render manifest with the immutable image
        run: |
          sed "s|image: IMAGE|image: ${IMAGE}|" \
            deploy/cloudrun/service-production.yaml > service.yaml
          grep -q "image: ${IMAGE}" service.yaml

      # replace waits until the new revision is ready, so a container that
      # fails its startup probe fails this step.
      - name: Apply manifest
        run: gcloud run services replace service.yaml --region=us-east1

      - name: Print service URL
        run: |
          url="$(gcloud run services describe test-api-production \
            --region=us-east1 --format='value(status.url)')"
          echo "Deployed ${IMAGE} to ${url}"
          echo "### production: ${url}" >> "$GITHUB_STEP_SUMMARY"
