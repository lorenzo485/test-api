name: deploy

# Deck branch model: a PR from feature/* deploys to development, a push (merge)
# to the staging branch deploys to staging. Production (tag v*) is the next
# harness layer and reuses the image built here.
on:
  pull_request:
  push:
    branches: [staging]

# One deploy per environment at a time, and never cancel one halfway: an
# interrupted `services replace` leaves the service in an unknown state.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && 'development' || 'staging' }}
  cancel-in-progress: false

# Least privilege at the top; only the jobs that talk to GCP get id-token.
permissions:
  contents: read

jobs:
  # Quality gate: the same ci.yml that runs on every PR, reused so the rules
  # live in one place. Skipped for PRs that would not deploy anyway. Fork PRs
  # are excluded because they never get vars or an OIDC token.
  ci:
    if: >-
      github.event_name == 'push' ||
      (startsWith(github.head_ref, 'feature/') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/ci.yml

  # Security gate: same trigger as ci. A called workflow cannot get more
  # permissions than its caller grants, and dependency-review comments on
  # the PR, so this job grants pull-requests: write.
  security:
    if: >-
      github.event_name == 'push' ||
      (startsWith(github.head_ref, 'feature/') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: write

  # Build once, deploy many: the image is tagged with the commit SHA and
  # pushed once. Later environments (production) promote this exact image by
  # its immutable tag; they never rebuild it, so what was tested is what runs.
  build:
    needs: [ci, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Environment name lands in the OIDC token, and each deployer SA only
    # trusts its own environment (infra/gcp/setup-wif.sh).
    environment: ${{ github.event_name == 'pull_request' && 'development' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # On a PR, github.sha is the test-merge commit that was checked out and
      # tested, so the tag matches the image contents.
      - id: image
        run: echo "ref=us-east1-docker.pkg.dev/lorenz-1234/test-api/test-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build and push
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

  # GitOps: the service is whatever deploy/cloudrun/service-<env>.yaml says.
  # Only the image line is filled in; everything else comes from Git, so a
  # manual console change is overwritten here.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'pull_request' && 'development' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET: ${{ github.event_name == 'pull_request' && 'development' || 'staging' }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Render manifest with the immutable image
        run: |
          manifest="deploy/cloudrun/service-${TARGET}.yaml"
          sed "s|image: IMAGE|image: ${IMAGE}|" "${manifest}" > service.yaml
          grep -q "image: ${IMAGE}" service.yaml

      # replace waits until the new revision is ready, so a container that
      # fails its startup probe fails this step.
      - name: Apply manifest
        run: gcloud run services replace service.yaml --region=us-east1

      - name: Print service URL
        run: |
          url="$(gcloud run services describe "test-api-${TARGET}" \
            --region=us-east1 --format='value(status.url)')"
          echo "Deployed ${IMAGE} to ${url}"
          echo "### ${TARGET}: ${url}" >> "$GITHUB_STEP_SUMMARY"
