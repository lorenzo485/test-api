name: release

# Deck branch model: a tag v* is the only way into production. The tag is cut
# from the staging branch, so it points at a commit whose image staging already
# built, deployed, and ran. This workflow promotes that image; it never builds.
on:
  push:
    tags: ["v*"]

# Releases queue up and are never cancelled halfway: an interrupted
# `services replace` leaves production in an unknown state.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: us-east1-docker.pkg.dev/lorenz-1234/test-api/test-api

jobs:
  # Cheap guard before anyone is asked to approve: the tag must be semver and
  # must point at a commit that is on the staging branch.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag is semver
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Tagged commit comes from staging
        run: |
          git fetch --no-tags origin staging
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/staging; then
            echo "::error::${GITHUB_SHA} is not on the staging branch; cut the tag from staging"
            exit 1
          fi

  # The production Environment has required reviewers, so this job waits for
  # the "four eyes" approval before GitHub issues an OIDC token. Without that
  # approval the production deployer SA cannot be impersonated at all.
  promote:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Build once, deploy many: look up the image staging built for this
      # exact commit and pin it by digest. A tag can be moved; a digest cannot.
      - name: Resolve the staging image digest
        id: image
        run: |
          if ! digest="$(gcloud artifacts docker images describe \
              "${REGISTRY_IMAGE}:${GITHUB_SHA}" \
              --format='value(image_summary.digest)')"; then
            echo "::error::No image for ${GITHUB_SHA}. Staging only builds the head of each push; tag a commit staging deployed."
            exit 1
          fi
          echo "ref=${REGISTRY_IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      # The release name becomes a second tag on the same image, which is
      # handy for humans and for rolling back to a known version.
      - name: Tag the image with the release
        run: |
          gcloud artifacts docker tags add \
            "${REGISTRY_IMAGE}:${GITHUB_SHA}" "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}"

      - name: Render manifest with the promoted image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          sed "s|image: IMAGE|image: ${IMAGE}|" \
            deploy/cloudrun/service-production.yaml > service.yaml
          grep -q "image: ${IMAGE}" service.yaml

      - name: Apply manifest
        run: gcloud run services replace service.yaml --region=us-east1

      # Traceability (deck slide 12): which commit, which image, which tag.
      # GitHub records who approved the production Environment.
      - name: Summary
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          url="$(gcloud run services describe test-api-production \
            --region=us-east1 --format='value(status.url)')"
          {
            echo "### production: ${url}"
            echo "- release: \`${GITHUB_REF_NAME}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- image: \`${IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
